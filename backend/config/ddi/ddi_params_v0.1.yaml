# DDI parameters, version ddi_params_v0.1
# Source of truth: docs/DDI-spec.md. These are PROPOSED DEFAULTS (documented assumptions),
# not empirically calibrated values. DDI is a transparent evidence-risk heuristic,
# not an industry standard. Changing any value requires a NEW version file.
#
# Day-3 note: v0.1 was amended in place BEFORE any assessment used it (R3 band fix and the missing
# constants of docs/day-3-implementation-brief.md section 3.3). Its SHA-256 is recorded in
# backend/config/params_hashes.json and verified at load time.

version: ddi_params_v0.1
status: proposed_defaults
direction: higher_is_more_debt
score_range: [0, 100]

# Equal prior: all applicable positive dimensions share weight 1/K.
weighting: equal_prior

tier_factor: {1: 1.00, 2: 0.75, 3: 0.50, 4: 0.25}
grade_factor: {A: 1.00, B: 0.75, C: 0.50, D: 0.25}
dq_factor: {pass: 1.0, warn: 0.7, critical: 0.0}

# freshness_factor = 0.5 ** (age_days / half_life_days), age from observed_end
half_life_days:
  behavioral: 90
  experiment: 180
  customer: 180
  financial: 120
  market: 365
  anecdotal: 90

design_rank: {rct: 1.0, holdout: 0.8, pre_post: 0.4, other: 0.2, none: 0.0}

# P2 small-n flag: an item with n_sample below this value is flagged small-n.
small_n_threshold: 100

experiment:
  power_target: 0.8
  srm_fail_integrity_factor: 0.3
  # informativeness by CI width relative to MDE: first matching row applies
  informativeness:
    - {max_ci_width_to_mde_ratio: 2, factor: 1.0}
    - {max_ci_width_to_mde_ratio: 4, factor: 0.6}
    - {max_ci_width_to_mde_ratio: null, factor: 0.3}
  # Used (and reported as "defaulted") when the fact is not stored.
  default_power_factor: 0.5          # achieved power is not stored
  default_informativeness: 0.3       # CI or MDE missing

customer:
  weights: {sample_adequacy: 0.5, segment_coverage: 0.3, relevance: 0.2}
  quote_count_for_full_adequacy: 100
  relevance_values: {direct: 1.0, adjacent: 0.5}
  default_relevance: 0.5             # adjacent; no relevance column exists
  default_segment_coverage: 0.5      # no relevant-segment list exists

behavioral:
  observational_cap: 0.6
  cap_lifted_when_d4_at_least: 0.6
  materiality_threshold: 0.02        # absolute effect; materiality = min(1, |effect| / threshold)
  n_required: 1000                   # adequacy = min(1, n / n_required); the metrics table has no MDE

financial:
  components: {quantified_estimate: 0.5, source_tier_at_most_2: 0.3, sensitivity_range_present: 0.2}
  quantified_estimate_rule: "effect_size present"
  sensitivity_range_rule: "ci_low and ci_high present"

penalties:
  contradiction_coefficient: 0.5
  uncertainty_coefficient: 0.25
  segment_divergence_floor_p1: 0.3

uncertainty:
  ci_component_when_effect_zero: 1.0
  # normalized concentration in [0, 1]: (HHI - 1/n) / (1 - 1/n), where n = number of distinct
  # evidence sources; 1.0 when n = 1.
  hhi_normalization: "(HHI - 1/n) / (1 - 1/n), 1.0 when n = 1"

# Evidence-direction summary (separate from the DDI, never part of it). Direction-bearing items have
# stance supports/contradicts and weight > 0. uncertain when gated, when fewer than min_direction_bearing_items
# such items exist, or when their total weight is 0.
direction:
  majority_share: 0.6
  min_direction_bearing_items: 2

bands:  # lower bound inclusive, upper bound exclusive, except the last band whose upper bound is inclusive
  - {name: low, min: 0, max: 25}
  - {name: moderate, min: 25, max: 50}
  - {name: high, min: 50, max: 75}
  - {name: critical, min: 75, max: 100, max_inclusive: true}

gating:
  min_evidence_items: 3
  min_evidence_types: 2
  require_success_metric_evidence: true
  block_on_open_critical_dq_for_success_metric: true

positive_dimensions: [D1, D2, D3, D4, D5, D6, D7]
penalty_dimensions: [P1, P2]

# Coverage checklists. A required entry may be {any_of: [...]}.
coverage_checklists:
  product_feature_investment: [behavioral, customer, experiment, financial]
  pricing_change: [behavioral, customer, experiment, financial]
  process_or_ux_change: [behavioral, customer, experiment]
  strategy_or_market_entry: [market, customer, financial]
  policy_or_operations: [behavioral, {any_of: [anecdotal, customer]}, financial]

# Dimensions NOT applicable per decision type (weights renormalized over the rest).
not_applicable_dimensions:
  product_feature_investment: []
  pricing_change: []
  process_or_ux_change: [D7]
  strategy_or_market_entry: [D4, D6]
  policy_or_operations: [D4]

sensitivity:
  weight_multipliers: [0.5, 1.5]
  penalty_multipliers: [0.5, 1.5]
  robust_if_band_unchanged_share_at_least: 0.9
