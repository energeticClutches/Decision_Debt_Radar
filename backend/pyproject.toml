[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-debt-radar-backend"
version = "0.1.0"
description = "Decision Debt Radar backend (FastAPI). Portfolio project; all demo data is synthetic."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlglot>=25",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "pyyaml>=6",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

# The backend is run from source (PYTHONPATH=backend). This installs dependencies only.
[tool.setuptools]
py-modules = []
