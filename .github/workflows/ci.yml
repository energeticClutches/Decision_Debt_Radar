# Continuous integration (free GitHub Actions minutes). No secrets are needed.
#
# What runs here: the backend tests that need no database (unit tests, the DDI and NBE engines, parameters, the SQL guard and the other pure-logic
# suites; every database-backed test skips itself when DATABASE_URL is not set: about 380 pass and 390 skip in under a minute) and the whole
# frontend check (tsc, Vitest, next build).
# What stays local: the database-backed suites and the 20 Playwright tests. Seeding about 2 million synthetic events (and, for Playwright,
# reseeding and preparing the four demo decisions) on every push would waste free minutes without adding evidence; run them locally (README).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # the frozen-path guard tests compare against earlier commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install the backend and its test tools
        run: pip install "./backend[dev]"
      - name: Tests that do not need the database
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build
